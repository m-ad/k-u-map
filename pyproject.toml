[project]
name = "k-u-map"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "contourpy>=1.3.3",
    "numpy>=2.4.6",
    "osmium>=4.3.1",
    "pillow>=12.3.0",
    "pmtiles>=3.8.1",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "mapbox-vector-tile>=2.2.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "data: needs the processed data in data/ (run the pipeline first)",
    "site: needs the built site in dist/",
]
